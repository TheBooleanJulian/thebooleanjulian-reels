/* ---------- Julian Unified UI tokens (thebooleanjulian-branding/dist/tokens.css) ---------- */

  --focus-ring: var(--cyan-ink); --success: #2de2a6; --warning: #ffc233; --danger: #ff6482;

  --cyan-tint: rgba(0, 101, 125, 0.08); --magenta-tint: rgba(168, 0, 138, 0.08); --on-accent: #02101a;
  --success: #00704f; --warning: #7f5400; --danger: #c4003a;

  --glow-magenta: 0 0 0 1px rgba(255, 43, 214, 0.55), 0 0 18px rgba(255, 43, 214, 0.30);

/* ---------- Unified UI components (spec section 4) ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/20px var(--font-sans); -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
.label { font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.display-lg { font: 700 28px/32px var(--font-display); letter-spacing: 0.04em; text-transform: uppercase; margin: 0; }
.heading { font: 600 20px/26px var(--font-display); letter-spacing: 0.02em; margin: 0; }

.btn:hover { border-color: var(--cyan-ink); color: var(--cyan-ink); background: var(--cyan-tint); }

.btn--primary:hover { background: var(--cyan); color: var(--on-accent); box-shadow: var(--glow-cyan); }

.btn--danger { border-color: var(--danger); color: var(--danger); }
.btn--danger:hover { border-color: var(--danger); color: var(--danger); background: transparent; box-shadow: 0 0 0 1px var(--danger); }
.btn--sm { height: var(--control-sm); padding: 0 var(--space-3); }
.btn--lg { height: var(--control-lg); padding: 0 var(--space-5); }
.btn:disabled { color: var(--ink-faint); border-color: var(--line); background: transparent; box-shadow: none; cursor: not-allowed; }
.kbd { font: 500 11.5px/16px var(--font-mono); color: var(--ink-muted); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); padding: 0 var(--space-1); text-transform: none; letter-spacing: 0; }

.field { display: flex; flex-direction: column; gap: var(--space-1); min-width: 0; }

.field__help { font: 400 12.5px/18px var(--font-sans); color: var(--ink-muted); }
.input, select.input, textarea.input { height: var(--control-md); padding: 0 var(--space-3); background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--radius-md); font: 400 14px/20px var(--font-sans); width: 100%; min-width: 0; transition: box-shadow var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out); }
textarea.input { height: auto; padding: var(--space-2) var(--space-3); resize: vertical; }
.input--mono { font: 400 13px/18px var(--font-mono); }
.input::placeholder { color: var(--ink-faint); }
.input:hover { border-color: var(--cyan-ink); }
.input:focus { outline: none; border-color: var(--cyan-ink); box-shadow: var(--glow-cyan); }
.input[aria-invalid="true"] { border-color: var(--danger); }
.input:disabled { color: var(--ink-faint); border-color: var(--line); background: var(--bg); cursor: not-allowed; }
.pathrow { display: flex; gap: var(--space-2); }
.pathrow .input { flex: 1; }

.toggle { display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; font: 400 14px/20px var(--font-sans); color: var(--ink); }
.toggle input { appearance: none; -webkit-appearance: none; margin: 0; position: relative; flex: none; width: 36px; height: 20px; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); background: var(--surface); cursor: pointer; transition: background var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out); }
.toggle input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: var(--radius-pill); background: var(--ink-muted); transition: transform var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out); }
.toggle input:checked { background: var(--cyan); border-color: var(--cyan-ink); }
.toggle input:checked::after { transform: translateX(16px); background: var(--on-accent); }
.toggle input:hover { box-shadow: var(--glow-cyan); }

.panel { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: var(--space-4); min-width: 0; }
.panel--raised { background: var(--surface-raised); }
.panel__title { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); margin: 0 0 var(--space-3); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.panel--bracket::before, .panel--bracket::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--cyan-ink); pointer-events: none; }
.panel--bracket::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: var(--radius-lg); }
.panel--bracket::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: var(--radius-lg); border-color: var(--magenta-ink); }
.stat { font: 700 28px/32px var(--font-display); letter-spacing: 0.04em; color: var(--ink); }

.badge { display: inline-flex; align-items: center; gap: 6px; height: 20px; padding: 0 var(--space-2); border: 1px solid currentColor; border-radius: var(--radius-sm); font: 500 11.5px/16px var(--font-mono); letter-spacing: 0.02em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: var(--radius-pill); background: currentColor; }
.badge--cyan { color: var(--cyan-ink); background: var(--cyan-tint); }
.badge--magenta { color: var(--magenta-ink); background: var(--magenta-tint); }
.badge--success { color: var(--success); }
.badge--warning { color: var(--warning); }
.badge--danger { color: var(--danger); }

.tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { position: relative; height: var(--control-md); padding: 0 var(--space-4); background: transparent; border: 0; color: var(--ink-muted); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; cursor: pointer; transition: color var(--dur-fast) var(--ease-out); }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--cyan-ink); }
.tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: linear-gradient(90deg, var(--cyan), var(--magenta)); }

.table { width: 100%; border-collapse: collapse; font: 500 11.5px/16px var(--font-mono); letter-spacing: 0.02em; color: var(--ink); }
.table th { text-align: left; padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line-strong); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); white-space: nowrap; }
.table td { padding: var(--space-2) var(--space-3); border-bottom: 1px solid var(--line); vertical-align: middle; }
.table tbody tr:hover { background: var(--surface-raised); }
.table tbody tr[aria-selected="true"] { background: var(--surface-overlay); box-shadow: inset 0 0 0 1px var(--cyan-ink); }
.table .num { text-align: right; }
.table tr.click { cursor: pointer; }
.table td .input { height: var(--control-sm); font-size: 12.5px; padding: 0 var(--space-2); min-width: 72px; }
.table td .input:not([type="number"]) { min-width: 120px; }
.table-wrap { overflow-x: auto; margin: 0 calc(-1 * var(--space-4)); padding: 0 var(--space-4); }

.progress { display: flex; flex-direction: column; gap: var(--space-1); }
.progress__meta { display: flex; justify-content: space-between; gap: var(--space-2); font: 500 11.5px/16px var(--font-mono); color: var(--ink-muted); }
.progress__track { height: 6px; background: var(--surface-overlay); border-radius: var(--radius-pill); overflow: hidden; }
.progress__fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--magenta)); border-radius: var(--radius-pill); transition: width var(--dur-slow) var(--ease-out); }
.progress--success .progress__fill { background: var(--success); }
.progress--danger .progress__fill { background: var(--danger); }
.progress__fill.indet { width: 30% !important; animation: indet 1.4s var(--ease-out) infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }

.alert { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3) var(--space-4); background: var(--surface-raised); border: 1px solid var(--line-strong); border-radius: var(--radius-lg); color: var(--ink); }
.alert__icon { flex: none; width: 20px; height: 20px; display: grid; place-items: center; border: 1px solid currentColor; border-radius: var(--radius-sm); font: 700 12px/1 var(--font-mono); }
.alert__title { font: 600 14px/20px var(--font-sans); }
.alert__body { font: 400 12.5px/18px var(--font-sans); color: var(--ink-muted); white-space: pre-wrap; }
.alert--info .alert__icon { color: var(--cyan-ink); } .alert--info { background: var(--cyan-tint); border-color: var(--cyan-ink); }
.alert--live .alert__icon { color: var(--magenta-ink); } .alert--live { background: var(--magenta-tint); border-color: var(--magenta-ink); }
.alert--success .alert__icon { color: var(--success); } .alert--success { border-color: var(--success); }
.alert--warning .alert__icon { color: var(--warning); } .alert--warning { border-color: var(--warning); }
.alert--danger .alert__icon { color: var(--danger); } .alert--danger { border-color: var(--danger); }

/* ---------- app shell, full window ---------- */
.shell { display: grid; grid-template-columns: var(--sidebar) 1fr; grid-template-rows: var(--titlebar) 1fr var(--statusbar); height: 100vh; background: var(--bg); overflow: hidden; }
.shell__title { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-3); background: var(--surface); border-bottom: 1px solid var(--line); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-muted); }
.shell__brand { display: flex; align-items: center; gap: var(--space-2); color: var(--ink); }
.shell__mark { width: 14px; height: 14px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--cyan), var(--magenta)); }
.shell__side { background: var(--surface); border-right: 1px solid var(--line); padding: var(--space-3) var(--space-2); display: flex; flex-direction: column; gap: var(--space-1); overflow-y: auto; }
.nav-item { display: flex; align-items: center; gap: var(--space-2); height: var(--control-md); padding: 0 var(--space-3); border: 1px solid transparent; border-radius: var(--radius-md); background: transparent; color: var(--ink-muted); font: 400 14px/20px var(--font-sans); cursor: pointer; text-align: left; transition: color var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out); }
.nav-item:hover { color: var(--ink); background: var(--surface-raised); }
.nav-item[aria-current="page"] { color: var(--cyan-ink); background: var(--surface-overlay); border-color: var(--cyan-ink); }
.nav-item svg { flex: none; }
.nav-group { margin: var(--space-3) var(--space-3) var(--space-1); font: 600 11px/14px var(--font-display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-faint); }
.shell__main { overflow: auto; padding: var(--space-6); background-image: radial-gradient(var(--line) 1px, transparent 1px); background-size: var(--space-5) var(--space-5); }
.shell__status { grid-column: 1 / -1; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-3); background: var(--surface); border-top: 1px solid var(--line); font: 500 11.5px/16px var(--font-mono); color: var(--ink-muted); white-space: nowrap; overflow: hidden; }
.live-dot { display: inline-block; width: 8px; height: 8px; margin-right: var(--space-1); border-radius: var(--radius-pill); background: var(--magenta); box-shadow: var(--glow-magenta); animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.45; } }
@media (max-width: 900px) {
  .shell { grid-template-columns: 48px 1fr; }
  .nav-item span, .nav-group { display: none; }
  .nav-item { justify-content: center; padding: 0; }
  .shell__main { padding: var(--space-4); }
}

/* ---------- page layout ---------- */
.page { display: flex; flex-direction: column; gap: var(--space-5); max-width: 1440px; margin: 0 auto; }
.page__head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); flex-wrap: wrap; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-5); align-items: start; }
.grid-edit { display: grid; grid-template-columns: minmax(300px, 0.85fr) minmax(0, 1.15fr); gap: var(--space-5); align-items: start; }
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-4); }
.fields--wide { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
@media (max-width: 1100px) { .grid2, .grid-edit { grid-template-columns: 1fr; } }
.viewer { background: #000; border-radius: var(--radius-md); width: 100%; max-height: 62vh; display: block; }
.viewer-img { width: 100%; border-radius: var(--radius-md); border: 1px solid var(--line); display: block; }
.empty { padding: var(--space-6) var(--space-4); text-align: center; color: var(--ink-muted); }
.log { margin: 0; padding: var(--space-3); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); font: 400 12px/17px var(--font-mono); color: var(--ink-muted); max-height: 46vh; overflow: auto; white-space: pre-wrap; word-break: break-word; }
.sep { height: 1px; background: var(--line); border: 0; margin: var(--space-2) 0; }
.right { margin-left: auto; }
details > summary { cursor: pointer; }
#flash:empty { display: none; }
/* ---------- editor: preview stage, transport, timeline, inspector ---------- */
.page--wide { max-width: 1800px; }
.editor { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: var(--space-4); align-items: start; }
@media (max-width: 1100px) { .editor { grid-template-columns: 1fr; } }
.stage-wrap { width: 100%; display: flex; justify-content: center; }
.stage { position: relative; overflow: hidden; background: #000; border-radius: var(--radius-md); box-shadow: 0 0 0 1px var(--line); }
.layer { position: absolute; inset: 0; }
#lay-media { z-index: 1; }

<body>
<div class="shell">
  <header class="shell__title">
    <div class="shell__brand"><span class="shell__mark" aria-hidden="true"></span><span>TBJ Reels Studio</span></div>
    <button class="btn btn--ghost btn--sm" id="theme" type="button" title="Switch theme">Light</button>
  </header>
  <nav class="shell__side" id="nav" aria-label="Sections"></nav>
  <main class="shell__main" id="main"></main>
  <footer class="shell__status" id="status"></footer>
</div>
<dialog id="dlg"><form method="dialog" class="col">
  <div class="heading" id="dlg-title"></div>
  <div class="field"><span class="label" id="dlg-label"></span><input class="input" id="dlg-input"></div>
  <div class="row"><span class="grow"></span><button class="btn" value="cancel" type="submit">Cancel</button>
    <button class="btn btn--primary" value="ok" id="dlg-ok" type="submit">Save</button></div>
</form></dialog>

<script>
'use strict';
const TOKEN = '__TOKEN__';

/* ================================================================ helpers */
const $ = (s, el = document) => el.querySelector(s);

const store = {
  get(k, d) { try { const v = localStorage.getItem('tbj-' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('tbj-' + k, JSON.stringify(v)); } catch (e) {} },

async function api(path, body) {
  const r = await fetch(path, { method: body ? 'POST' : 'GET', headers: { 'X-Token': TOKEN, 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });

}
const media = p => `/media?t=${encodeURIComponent(TOKEN)}&p=${encodeURIComponent(p)}`;
const fmtT = t => { if (t === null || t === undefined || isNaN(t)) return '–'; t = Math.max(0, t); const m = Math.floor(t / 60); return `${String(m).padStart(2, '0')}:${(t - m * 60).toFixed(1).padStart(4, '0')}`; };
const fmtDur = t => { if (!t && t !== 0) return '–'; const m = Math.floor(t / 60), s = Math.round(t - m * 60); return `${m}:${String(s).padStart(2, '0')}`; };

const fmtWhen = s => { const d = new Date(s * 1000); return d.toLocaleDateString('en-SG', { day: '2-digit', month: 'short' }) + ' ' + d.toTimeString().slice(0, 5); };
const base = p => (p || '').split(/[\\/]/).pop();
const round3 = x => Math.round(x * 1000) / 1000;
const clone = o => JSON.parse(JSON.stringify(o));

function alertBox(kind, title, body, onClose) {
  const glyph = { info: 'i', live: '~', success: '✓', warning: '!', danger: 'x' }[kind];
  return h('div', { class: `alert alert--${kind}`, role: kind === 'danger' ? 'alert' : 'status' },
    h('span', { class: 'alert__icon', 'aria-hidden': 'true' }, glyph),
    h('div', { class: 'grow' }, h('div', { class: 'alert__title' }, title), body ? h('div', { class: 'alert__body' }, body) : null),

}
let flashEl = null;
function flash(kind, title, body) {
  flashEl = { kind, title, body };
  const slot = $('#flash'); if (!slot) return;
  slot.replaceChildren(alertBox(kind, title, body, () => { flashEl = null; slot.replaceChildren(); }));
}
function flashSlot() { const s = h('div', { id: 'flash' }); if (flashEl) s.append(alertBox(flashEl.kind, flashEl.title, flashEl.body, () => { flashEl = null; s.replaceChildren(); })); return s; }
function fail(e) { flash('danger', 'Something went wrong', String(e.message || e)); }
window.addEventListener('error', e => /ResizeObserver loop/.test(e.message || '') ? null : flash('danger', 'Page error', `${e.message} (line ${e.lineno}). Reload the page; if it repeats, note what you clicked.`));

function field(label, control, help) { return h('label', { class: 'field' }, h('span', { class: 'label' }, label), control, help ? h('span', { class: 'field__help' }, help) : null); }
function textInput(value, oninput, attrs = {}) { return h('input', { class: 'input' + (attrs.mono ? ' input--mono' : ''), value: value ?? '', oninput: e => oninput(e.target.value), ...attrs, mono: null }); }
function numInput(value, oninput, attrs = {}) { return h('input', { class: 'input input--mono', type: 'number', value: value ?? '', step: attrs.step || 'any', min: attrs.min, max: attrs.max, placeholder: attrs.placeholder, oninput: e => oninput(e.target.value === '' ? null : Number(e.target.value)) }); }
function select(value, options, onchange) { return h('select', { class: 'input', onchange: e => onchange(e.target.value) }, options.map(([v, l]) => h('option', { value: v, selected: String(v) === String(value) ? true : null }, l))); }
function toggle(label, checked, onchange) { return h('label', { class: 'toggle' }, h('input', { type: 'checkbox', role: 'switch', checked, onchange: e => onchange(e.target.checked) }), label); }
async function pick(kind, filter, title, initial) {
  try { const r = await api('/api/pick', { kind, filter, title, initial }); if (r.error) flash('warning', 'No file dialog', r.error); return r.path || ''; }
  catch (e) { fail(e); return ''; }
}

  const inp = h('input', { class: 'input input--mono', value: value || '', placeholder: opts.placeholder || 'Choose or paste a path', oninput: e => onchange(e.target.value.trim()) });
  const browse = h('button', { class: 'btn', type: 'button', onclick: async () => { const p = await pick(opts.kind || 'file', opts.filter, opts.title || label, inp.value || opts.initial); if (p) { inp.value = p; onchange(p); } } }, opts.kind === 'save' ? 'Save as' : 'Browse');

/* ================================================================ app state */

  ['Make', [['polaroid', 'Polaroid recap', 'images'], ['interview', 'Interview', 'mic'], ['presentation', 'Presentation', 'presentation'], ['reel', 'Reel presets', 'film']]],

/* ================================================================ jobs + status bar */

/* ================================================================ outputs viewer */
function viewer(path, opts = {}) {

  if (/\.(jpe?g|png)$/i.test(path)) return h('img', { class: 'viewer-img', src: media(path) + `&v=${Date.now()}`, alt: base(path) });

}
function showIn(path) { return h('button', { class: 'btn btn--sm', type: 'button', onclick: () => api('/api/open', { path }).catch(fail) }, 'Show in folder'); }

/* ================================================================ POLAROID */
function viewPolaroid() {

/* ================================================================ REEL PRESETS (the original 9:16 engine) */
function viewReel() {

  const remembered = store.get('project-reel', null);

      field('Template', select(nf.template, tpls.map(t => [t, t]), v => { nf.template = v; }))),
    pathField('Video', '', v => { nf.video = v; }, { filter: 'video', placeholder: 'Optional for photo-led presets' }),
    toggle('Copy into raw/', nf.copy, v => { nf.copy = v; }),
    h('div', { class: 'row' }, h('button', { class: 'btn', type: 'button', onclick: () => {
      if (!nf.name) return flash('warning', 'Name needed', 'Give the project a name.');
      runJob({ tool: 'new', name: nf.name, template: nf.template, video: nf.video, in_place: !nf.copy }, async j => { if (j.status === 'done') { await refreshStateOnce(); openProject(nf.name, 'reel'); } });
    } }, 'Create')));
  const picker = h('section', { class: 'panel col' },
    h('h2', { class: 'panel__title' }, 'Project'),
    reels.length ? select(P ? P.name : '', [['', 'Choose a reel project'], ...reels.map(p => [p.name, p.name])], v => v && openProject(v, 'reel')) : h('span', { class: 'body-sm' }, 'No reel projects yet.'));
  if (!P) return h('div', { class: 'page' }, h('div', { class: 'page__head' }, h('div', { class: 'col' }, h('h1', { class: 'display-lg' }, 'Reel presets'),
    h('span', { class: 'body-sm' }, 'The 9:16 HUD engine: hook, plan, BTS, reveal, talking head. Look comes from style/signature.json.'))), flashSlot(), h('div', { class: 'grid2' }, picker, newPanel));
  const scenes = P.preset.scenes || [];
  const talking = scenes.some(s => s.kind === 'talking_head');
  let only = '';
  const area = h('textarea', { class: 'input input--mono', rows: 26, spellcheck: 'false' }, P.preset_text);
  const outs = P.outputs || [];
  const sheet = (P.stills || []).find(s => s.name === 'sheet.jpg');
  let chosen = store.get('render-view-' + P.name, null);
  const items = [...outs.map(o => ({ ...o, label: o.name })), ...(sheet ? [{ ...sheet, label: 'Stills sheet' }] : [])];
  if (!items.some(i => i.path === chosen)) chosen = (sheet || outs[0] || {}).path || null;
  const act = (label, action, cls = '') => h('button', { class: 'btn ' + cls, type: 'button', onclick: () => runJob({ tool: 'make', name: P.name, action, only: action === 'build' && only !== '' ? only : null }) }, label);
  return h('div', { class: 'page' },
    h('div', { class: 'page__head' }, h('div', { class: 'col' }, h('div', { class: 'row' }, h('h1', { class: 'display-lg' }, P.name), h('span', { class: 'badge badge--cyan' }, 'reel')),
      h('span', { class: 'mono-sm muted' }, `${scenes.length} scenes: ${scenes.map(s => s.name || s.kind).join(', ')}`)),
      h('div', { class: 'row' }, select(P.name, reels.map(p => [p.name, p.name]), v => openProject(v, 'reel')), h('button', { class: 'btn', type: 'button', onclick: () => { S.P = null; store.set('project-reel', null); render(); } }, 'Close'))),
    flashSlot(),
    h('div', { class: 'grid2' },
      h('div', { class: 'col' },
        h('section', { class: 'panel panel--bracket col' },
          h('h2', { class: 'panel__title' }, 'Render'),
          h('div', { class: 'row' }, talking && !P.words ? h('button', { class: 'btn btn--accent', type: 'button', onclick: () => runJob({ tool: 'transcribe', name: P.name, model: 'small.en' }) }, 'Transcribe') : null,
            talking ? act('Rough cut', 'roughcut') : null, act('Stills', 'stills'), act('Build', 'build', 'btn--primary'),
            field('Only scene', select('', [['', 'All'], ...scenes.map((s, i) => [i, `${i}: ${s.name || s.kind}`])], v => { only = v; }))),
          h('span', { class: 'field__help' }, 'Stills first; one full build once they look right. "Only scene" re-renders one scene and re-joins the rest.'),

          viewer(chosen))),

        area,
        h('div', { class: 'row' }, h('button', { class: 'btn btn--primary', type: 'button', onclick: async () => {
          try { await api('/api/save', { name: P.name, preset_text: area.value }); flash('success', 'Preset saved', 'Run Stills to see the change.'); reloadProject(); } catch (e) { fail(e); }
        } }, 'Save')))));
}

/* ================================================================ PROJECTS / JOBS / SETUP */
function viewProjects() {
  const list = S.state.projects;
  return h('div', { class: 'page' },
    h('div', { class: 'page__head' }, h('div', { class: 'col' }, h('h1', { class: 'display-lg' }, 'Projects'), h('span', { class: 'body-sm' }, 'Everything under projects/. Polaroid recaps are written next to their photo folders.'))),
    flashSlot(),
    h('section', { class: 'panel', style: 'padding:0' }, list.length ? projectTable(list) : h('div', { class: 'empty' }, 'No projects yet.')));
}
let jobSel = null;
function viewJobs() {
  const jobs = S.state.jobs;
  if (!jobSel && jobs.length) jobSel = jobs[0].id;
  const page = h('div', { class: 'page' },
    h('div', { class: 'page__head' }, h('div', { class: 'col' }, h('h1', { class: 'display-lg' }, 'Jobs'), h('span', { class: 'body-sm' }, 'One job runs at a time; the rest wait in order. Jobs are kept until the studio closes.'))),
    flashSlot(),
    h('div', { class: 'grid2' },
      h('section', { class: 'panel', style: 'padding:0', id: 'jobs-table' }),
      h('section', { class: 'panel col', id: 'job-detail' })));
  setTimeout(updateJobsView, 0);
  return page;
}
async function updateJobsView() {
  const tbl = $('#jobs-table'); if (!tbl) return;
  const jobs = S.state.jobs;
  const badge = s => h('span', { class: 'badge ' + ({ running: 'badge--magenta', done: 'badge--success', failed: 'badge--danger', queued: 'badge--cyan', cancelled: 'badge--warning' }[s] || '') }, { running: 'Running', done: 'Done', failed: 'Failed', queued: 'Queued', cancelled: 'Stopped' }[s]);
  tbl.replaceChildren(jobs.length ? h('table', { class: 'table' },
    h('thead', {}, h('tr', {}, h('th', {}, 'Job'), h('th', {}, 'Status'), h('th', { class: 'num' }, 'Progress'), h('th', {}, 'Started'))),
    h('tbody', {}, jobs.map(j => h('tr', { class: 'click', tabindex: 0, 'aria-selected': j.id === jobSel ? 'true' : null, onclick: () => { jobSel = j.id; updateJobsView(); } },
      h('td', {}, j.title), h('td', {}, badge(j.status)), h('td', { class: 'num' }, j.progress === null ? '–' : Math.round(j.progress) + '%'), h('td', {}, j.started ? fmtWhen(j.started) : '–')))))
    : h('div', { class: 'empty' }, 'No jobs yet.'));
  const det = $('#job-detail'); if (!det) return;
  const j = jobs.find(x => x.id === jobSel);
  if (!j) { det.replaceChildren(h('div', { class: 'empty body-sm' }, 'Select a job to see its log.')); return; }
  try {
    // whole log each time: progress lines are rewritten in place, so appending from an offset would miss updates
    const full = await api(`/api/job?id=${j.id}&from=0`);
    const pre = h('pre', { class: 'log' }, full.log.join('\n'));
    det.replaceChildren(
      h('h2', { class: 'panel__title' }, j.title, h('span', { class: 'row', style: 'gap:8px' },
        (j.status === 'running' || j.status === 'queued') ? h('button', { class: 'btn btn--danger btn--sm', type: 'button', onclick: () => { if (confirm('Stop this job?')) api('/api/cancel', { id: j.id }).then(refreshState).catch(fail); } }, 'Stop') : null)),
      jobProgress(j), h('span', { class: 'mono-sm muted', style: 'word-break: break-all' }, j.command), pre,
      j.outputs.length ? h('div', { class: 'row' }, j.outputs.map(o => h('span', { class: 'row', style: 'gap:8px' }, h('span', { class: 'mono-sm' }, base(o)), showIn(o)))) : null);
    pre.scrollTop = pre.scrollHeight;
  } catch (e) { det.replaceChildren(alertBox('danger', 'Could not load the log', String(e.message))); }
}
function viewCheck() {
  const env = S.env || {};
  const row = (name, ok, detail, optional) => h('tr', {}, h('td', {}, name), h('td', {}, h('span', { class: 'badge ' + (ok ? 'badge--success' : optional ? 'badge--warning' : 'badge--danger') }, ok ? 'OK' : optional ? 'Missing' : 'Fail')), h('td', { style: 'word-break: break-all' }, detail || ''));
  const inVenv = /[\\/]\.polaroid-reel[\\/]venv[\\/]/i.test(env.python_path || '');
  const pipCmd = pkg => `"${env.python_path || 'python'}" -m pip install ${pkg}`;
  const missing = [!env.whisper && 'faster-whisper', !env.cv2 && 'opencv-python imageio-ffmpeg'].filter(Boolean);
  return h('div', { class: 'page' },
    h('div', { class: 'page__head' }, h('div', { class: 'col' }, h('h1', { class: 'display-lg' }, 'Setup'), h('span', { class: 'body-sm' }, 'What this laptop has. First time: double-click setup.bat in polaroid-reel/.'))),
    flashSlot(),
    env.python_path && !inVenv ? alertBox('warning', 'Not running in the tool environment',
      `The studio is using ${env.python_path}.\nDouble-click polaroid-reel\\setup.bat once (installs everything into its own Python 3.12), then close this window and reopen studio.bat.`) : null,
    missing.length ? h('section', { class: 'panel col' },
      h('h2', { class: 'panel__title' }, 'Install the missing parts'),
      h('span', { class: 'body-sm' }, 'Easiest: run polaroid-reel\\setup.bat. Or paste this exact line into a terminal (it installs into the Python the studio runs on):'),
      h('div', { class: 'pathrow' }, h('input', { class: 'input input--mono', readonly: true, value: pipCmd(missing.join(' ')), onfocus: e => e.target.select() }),
        h('button', { class: 'btn', type: 'button', onclick: () => navigator.clipboard.writeText(pipCmd(missing.join(' '))).then(() => flash('success', 'Copied', 'Paste it into Command Prompt, then reopen studio.bat.')).catch(() => flash('info', 'Select the line and copy it', '')) }, 'Copy')),
      h('span', { class: 'field__help' }, 'Then close the studio window and open studio.bat again.')) : null,
    h('div', { class: 'grid2' },
      h('section', { class: 'panel', style: 'padding:0' },
        h('table', { class: 'table' }, h('thead', {}, h('tr', {}, h('th', {}, 'Part'), h('th', {}, 'Status'), h('th', {}, 'Detail'))),
          h('tbody', {},
            row('Python', !!env.python, `${env.python || ''}  ${env.python_path || ''}`),
            row('ffmpeg', !!env.ffmpeg, env.ffmpeg || 'Not found: run setup.bat or install ffmpeg'),
            row('File dialogs (Tk)', !!env.tk, env.tk ? '' : 'Paste paths into the fields instead', true),
            row('Transcription', !!env.whisper, env.whisper ? 'faster-whisper' : 'Needed for interviews, presentations and talking heads. See "Install the missing parts" above.', true),
            row('Polaroid engine', !!env.cv2, env.cv2 ? 'opencv' : 'See "Install the missing parts" above.', true),
            row('Tool folder', true, env.root)))),
      h('section', { class: 'panel col' },
        h('h2', { class: 'panel__title' }, 'Full check', h('button', { class: 'btn btn--sm', type: 'button', onclick: () => runJob({ tool: 'doctor' }, j => { jobSel = j.id; go('jobs'); }) }, 'Run doctor.py')),
        h('span', { class: 'body-sm' }, 'Checks fonts, packages and disk space for the reel engines and writes setup/last_check.txt.'))));
}

/* ================================================================ boot */
function setThemeButton() {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  $('#theme').textContent = cur === 'dark' ? 'Light' : 'Dark';
  $('#theme').title = `Switch to ${cur === 'dark' ? 'light' : 'dark'} theme`;
}
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('tbj-theme', next); } catch (e) {}       // raw string: the <head> script reads it before paint
  setThemeButton();
});
(async function boot() {
  setThemeButton(); renderNav();
  try { S.env = await api('/api/env'); } catch (e) {}
  await refreshStateOnce();
  for (const j of S.state.jobs) if (j.status === 'done' || j.status === 'failed') S.seenDone.add(j.id);
  S.firstJob = Math.max(0, ...S.state.jobs.map(j => j.id));
  const [hv, hp, ht] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (VIEWS.some(([, items]) => items.some(([id]) => id === hv))) {
    S.view = hv;
    if (hp && ['interview', 'presentation', 'reel'].includes(hv)) store.set('project-' + hv, hp);
    if (ht) S.tab = { output: 'export', render: 'export' }[ht] || ht;
  }
  renderNav(); render(); refreshState();
})();
</script>
